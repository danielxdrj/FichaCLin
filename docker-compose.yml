# Ambiente local. Em produção, o TLS fica no proxy reverso (REQ-27) e o volume do banco
# deve estar em disco criptografado (REQ-28), em datacenter no Brasil (REQ-13).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fichaclin
      POSTGRES_USER: fichaclin_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:-dev_owner_password}
    ports:
      - "5434:5432"
    volumes:
      - fichaclin_db:/var/lib/postgresql/data
      - ./apps/api/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fichaclin_owner -d fichaclin"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fichaclin_db:
